<g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14">
<text x="586" y="94" xml:space="preserve"><tspan fill="#5eead4" font-weight="700">$ </tspan><tspan fill="#8d97ad">spacegraph view bedroom.json --shot doorway_wide</tspan></text>
<text x="586" y="133.0" xml:space="preserve"><tspan fill="#8d97ad" font-weight="700">SPACE    </tspan><tspan fill="#e8ecf4">bedroom</tspan></text>
<text x="586" y="152.5" xml:space="preserve"><tspan fill="#8d97ad" font-weight="700">CAMERA   </tspan><tspan fill="#e8ecf4">at (3.6, 0.3, 1.5), facing NW, hfov 70</tspan></text>
<text x="586" y="172.0" xml:space="preserve"><tspan fill="#8d97ad" font-weight="700">SUBJECT  </tspan><tspan fill="#f472b6">her: front view, left, midground, 2.59 m</tspan></text>
<text x="586" y="191.5" xml:space="preserve"><tspan fill="#8d97ad">         her right side is frame-left</tspan></text>
<text x="586" y="230.5" xml:space="preserve"><tspan fill="#5eead4" font-weight="700">IN FRAME (left → right)</tspan></text>
<text x="586" y="250.0" xml:space="preserve"><tspan fill="#e8ecf4">  bench       left, low, foreground</tspan></text>
<text x="586" y="269.5" xml:space="preserve"><tspan fill="#e8ecf4">  bed         centre, low, midground</tspan></text>
<text x="586" y="289.0" xml:space="preserve"><tspan fill="#e8ecf4">  nightstand  centre, mid, background</tspan></text>
<text x="586" y="308.5" xml:space="preserve"><tspan fill="#e8ecf4">  print       centre, mid, background</tspan></text>
<text x="586" y="328.0" xml:space="preserve"><tspan fill="#fbbf24" font-weight="700">PARTLY IN FRAME</tspan></text>
<text x="586" y="347.5" xml:space="preserve"><tspan fill="#e8ecf4">  rail        34% · cut by the left edge</tspan></text>
<text x="586" y="367.0" xml:space="preserve"><tspan fill="#7d89a8" font-weight="700">OUT OF FRAME (leave out of the prompt)</tspan></text>
<text x="586" y="386.5" xml:space="preserve"><tspan fill="#8d97ad">  window      off the right edge</tspan></text>
<text x="586" y="406.0" xml:space="preserve"><tspan fill="#8d97ad">  mirror      off the right edge</tspan></text>
<text x="586" y="425.5" xml:space="preserve"><tspan fill="#8d97ad">  door        behind the camera</tspan></text>
<text x="586" y="464.5" xml:space="preserve"><tspan fill="#a78bfa" font-weight="700">DRAFT</tspan></text>
<text x="586" y="484.0" xml:space="preserve"><tspan fill="#e8ecf4">  The far wall is warm white. A walnut nightstand,</tspan></text>
<text x="586" y="503.5" xml:space="preserve"><tspan fill="#e8ecf4">  with a pink glass lamp and a bottle of rosé on it,</tspan></text>
<text x="586" y="523.0" xml:space="preserve"><tspan fill="#e8ecf4">  is in the centre of the frame. …</tspan></text>
</g>
