<text x="62" y="310" fill="#e8ecf4" font-size="13" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"> "wall": "E", "mirror": true}</text>
<text x="62" y="332" fill="#8d97ad" font-size="13" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" xml:space="preserve"></text>
