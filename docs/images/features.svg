<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141b33"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  <radialGradient id="cone" cx="0" cy="0.5" r="1"><stop offset="0" stop-color="#5eead4" stop-opacity="0.45"/><stop offset="1" stop-color="#5eead4" stop-opacity="0.02"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<rect width="1280" height="300" rx="18" fill="url(#bg)"/>
<rect width="1280" height="300" rx="18" fill="url(#grid)"/>
<rect x="40" y="40" width="280" height="220" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#5eead4" stroke-opacity="0.45"/>
